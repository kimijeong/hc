<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEVER</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --blue:           #2a78d6;
    --blue-soft:      #86b6ef;
    --aqua:           #1baf7a;
    --good:           #0ca30c;
    --warning:        #fab219;
    --serious:        #ec835a;
    --critical:       #d03b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  header.topbar{
    min-height:65px;
    padding:0 20px;
    background: var(--surface-1);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    align-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  header.topbar h1{ font-size:20px; margin:0; display:flex; align-items:center; gap:8px; }
  header.topbar h1 img{ width:44px; height:44px; border-radius:10px; object-fit:cover; }
  header.topbar p{ margin:0; font-size:13px; color:var(--text-secondary); }

  .layout{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:0;
    min-height: calc(100vh - 62px);
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  .sidebar{
    background: var(--surface-1);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    max-height: calc(100vh - 62px);
    overflow-y:auto;
  }
  .sidebar-section{ padding:14px 16px; border-bottom:1px solid var(--border); }
  .sidebar-section h2{ font-size:14px; margin:0 0 10px; color:var(--text-secondary); }

  .river-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:8px;
    border:1px solid var(--border);
    margin-bottom:8px;
    cursor:pointer;
    background:var(--surface-1);
  }
  .river-card:hover{ background:#f2f1ee; }
  .river-card .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 auto; border:2px solid #fff; box-shadow:0 0 0 1px var(--border); }
  .river-card .info{ flex:1; min-width:0; }
  .river-card .info .name{ font-size:14px; font-weight:600; }
  .river-card .info .sub{ font-size:11px; color:var(--text-muted); }
  .river-card .badge{ font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; color:#fff; }
  .river-card .warn-flag{ font-size:10px; color:var(--critical); font-weight:700; }

  .river-group{ margin-bottom:8px; }
  .river-group-head{
    display:flex; align-items:center; gap:10px; padding:10px; cursor:pointer;
    border:1px solid var(--border); border-radius:8px; background:#f2f1ee;
  }
  .river-group.open .river-group-head{ border-radius:8px 8px 0 0; }
  .river-group-head:hover{ background:#eceae5; }
  .river-group-head .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 auto; border:2px solid #fff; box-shadow:0 0 0 1px var(--border); }
  .river-group-head .info{ flex:1; min-width:0; }
  .river-group-head .name{ font-size:14px; font-weight:700; }
  .river-group-head .group-count{ font-weight:400; font-size:11px; color:var(--text-muted); }
  .river-group-head .sub{ font-size:11px; color:var(--text-muted); }
  .group-arrow{ font-size:11px; color:var(--text-muted); transition:transform .15s; flex:0 0 auto; }
  .river-group.open .group-arrow{ transform:rotate(180deg); }
  .river-group-body{
    border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px;
    padding:8px; display:none; flex-direction:column; gap:6px; background:#fbfbfa;
  }
  .river-group.open .river-group-body{ display:flex; }
  .river-group-body .river-card{ margin-bottom:0; }

  #reportForm{ display:flex; flex-direction:column; gap:8px; }
  #reportForm label{ font-size:12px; color:var(--text-secondary); display:flex; flex-direction:column; gap:4px; }
  #reportForm select, #reportForm textarea{
    font-family:inherit; font-size:13px; padding:7px 8px; border-radius:6px;
    border:1px solid var(--baseline); background:#fff; color:var(--text-primary);
    resize:vertical;
  }
  #reportForm textarea{ min-height:56px; }
  #reportForm button{
    margin-top:2px; padding:9px; border:none; border-radius:6px;
    background: var(--blue); color:#fff; font-weight:700; font-size:13px; cursor:pointer;
  }
  #reportForm button:hover{ background:#1c5cab; }

  .report-feed{ max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  .report-item{ border:1px solid var(--border); border-radius:6px; padding:8px; font-size:12px; }
  .report-item .rf-head{ display:flex; justify-content:space-between; gap:6px; font-weight:700; }
  .report-item .rf-river{ color: var(--blue); }
  .report-item .rf-time{ color: var(--text-muted); font-weight:400; }
  .report-item .rf-symptom{ display:inline-block; margin-top:3px; font-size:11px; padding:1px 6px; border-radius:999px; background:#fdecea; color:var(--critical); font-weight:700; }
  .report-item .rf-comment{ margin-top:4px; color:var(--text-secondary); }
  .report-empty{ font-size:12px; color:var(--text-muted); padding:8px 0; }

  .tab-bar{ display:flex; border-bottom:1px solid var(--border); }
  .tab-btn{ flex:1; padding:12px; border:none; background:none; cursor:pointer; font-size:13px; font-weight:700; color:var(--text-muted); border-bottom:2px solid transparent; }
  .tab-btn.active{ color:var(--text-primary); border-bottom-color:var(--blue); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .community-stats{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .stat-pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 8px; border-radius:999px; background:#f2f1ee; border:1px solid var(--border); }
  .stat-pill .dot{ width:8px; height:8px; border-radius:50%; }

  .filter-select{ width:100%; margin-bottom:10px; font-family:inherit; font-size:13px; padding:7px 8px; border-radius:6px; border:1px solid var(--baseline); background:#fff; color:var(--text-primary); }

  .map-wrap{ position:relative; }
  #map{ width:100%; height:100%; min-height:420px; }

  .map-fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#eef2f6; color:var(--text-secondary); font-size:13px; text-align:center; padding:24px;
    flex-direction:column; gap:8px;
  }
  .map-fallback code{ background:#fff; padding:2px 6px; border-radius:4px; border:1px solid var(--border); }

  .alert-banner{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:6;
    background:var(--critical); color:#fff; padding:8px 16px; border-radius:999px;
    font-size:12.5px; font-weight:700; display:none; align-items:center; gap:8px; cursor:pointer;
    box-shadow:0 2px 10px rgba(208,59,59,0.45); animation: alertFlash 1.2s ease-in-out infinite;
    white-space:nowrap;
  }
  .alert-banner.show{ display:flex; }
  .alert-banner .ab-cta{ text-decoration:underline; }
  @keyframes alertFlash{ 0%,100%{ box-shadow:0 2px 10px rgba(208,59,59,0.45);} 50%{ box-shadow:0 2px 22px rgba(208,59,59,0.95);} }

  .legend{
    position:absolute; left:12px; bottom:12px; background:rgba(252,252,251,0.95);
    border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:11px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08); z-index:5;
  }
  .legend .title{ font-weight:700; margin-bottom:6px; }
  .legend .row{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .legend .sw{ width:10px; height:10px; border-radius:50%; }

  .river-marker{
    position:relative; width:22px; height:22px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35); cursor:pointer;
  }
  .river-marker.danger{ animation: markerFlash 1s ease-in-out infinite; }
  .river-marker.danger::before, .river-marker.danger::after{
    content:''; position:absolute; inset:-10px; border-radius:50%; border:3px solid var(--critical);
    animation: sirenRing 1.1s ease-out infinite;
  }
  .river-marker.danger::after{ animation-delay:0.55s; }
  @keyframes markerFlash{ 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.55);} }
  @keyframes sirenRing{ 0%{ transform:scale(0.5); opacity:0.9;} 100%{ transform:scale(2.3); opacity:0;} }

  .report-marker{
    width:14px; height:14px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    border:2px solid #fff; background:var(--critical); box-shadow:0 1px 4px rgba(0,0,0,0.35); cursor:pointer;
  }
  .kakao-popup{
    background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px 10px;
    font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,0.18); max-width:200px; position:relative;
  }
  .kakao-popup .close{ position:absolute; top:2px; right:6px; cursor:pointer; color:var(--text-muted); font-weight:700; }

  /* Detail drawer */
  .overlay-bg{
    position:fixed; inset:0; background:rgba(11,11,11,0.35); z-index:20;
    display:none;
  }
  .overlay-bg.open{ display:block; }
  .detail-drawer{
    position:fixed; top:0; right:0; height:100%; width:min(480px, 100%);
    background:var(--surface-1); z-index:21; box-shadow:-6px 0 24px rgba(0,0,0,0.18);
    transform:translateX(100%); transition:transform .25s ease;
    overflow-y:auto; padding-bottom:40px;
  }
  .detail-drawer.open{ transform:translateX(0); }
  .detail-head{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .detail-head h2{ margin:0 0 4px; font-size:18px; }
  .detail-head .loc{ font-size:12px; color:var(--text-muted); }
  .detail-close{ border:none; background:none; font-size:20px; cursor:pointer; color:var(--text-muted); line-height:1; }

  .grade-hero{ display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border); }
  .grade-hero .badge-lg{ font-size:22px; font-weight:800; color:#fff; padding:8px 16px; border-radius:10px; }
  .grade-hero .glabel{ font-size:13px; color:var(--text-secondary); }
  .grade-hero .glabel b{ display:block; font-size:14px; color:var(--text-primary); }

  .manip-banner{
    margin:14px 18px 0; padding:10px 12px; border-radius:8px;
    background:#fdecea; border:1px solid var(--critical); color:var(--critical);
    font-size:13px; font-weight:700; display:flex; gap:8px; align-items:flex-start;
  }

  .live-badge{
    margin:10px 18px 0; padding:6px 10px; border-radius:6px; font-size:12px; font-weight:700; display:inline-block;
  }
  .live-badge.live-on{ background:#eafaf0; color:var(--good); border:1px solid var(--good); }
  .live-badge.live-off{ background:#f2f1ee; color:var(--text-muted); border:1px solid var(--baseline); }

  .src-tag{ font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:999px; vertical-align:middle; }
  .src-tag.src-live{ background:#eafaf0; color:var(--good); }
  .src-tag.src-lab{ background:#f2f1ee; color:var(--text-muted); }

  .ai-panel{ padding:8px 18px 18px; }
  .ai-btn{
    padding:9px 14px; border:none; border-radius:6px; background:var(--text-primary); color:#fff;
    font-weight:700; font-size:13px; cursor:pointer;
  }
  .ai-btn:disabled{ opacity:0.6; cursor:default; }
  .ai-btn:hover:not(:disabled){ background:#2c2c2a; }
  .ai-result{
    margin-top:10px; padding:12px; border-radius:8px; background:#f2f1ee; border:1px solid var(--border);
    font-size:13px; line-height:1.6; color:var(--text-primary); white-space:normal;
  }
  .ai-error{
    margin-top:10px; padding:10px 12px; border-radius:8px; background:#fdecea; border:1px solid var(--critical);
    font-size:12.5px; color:var(--critical);
  }

  .compare-toggle{ padding:14px 18px 0; }
  .switch-row{ display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600; }
  .switch{ position:relative; width:40px; height:22px; flex:0 0 auto; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:var(--baseline); border-radius:999px; cursor:pointer; transition:.2s; }
  .slider:before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider{ background:var(--blue); }
  .switch input:checked + .slider:before{ transform:translateX(18px); }

  .metrics-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 18px; }
  .metric-card{ border:1px solid var(--border); border-radius:8px; padding:10px; }
  .metric-card .m-label{ font-size:11px; color:var(--text-muted); }
  .metric-card .m-value{ font-size:18px; font-weight:700; margin-top:2px; }
  .metric-card .m-value.exceed{ color:var(--critical); }
  .metric-card .m-std{ font-size:10px; color:var(--text-muted); margin-top:2px; }

  table.compare-table{ width:calc(100% - 36px); margin:0 18px; border-collapse:collapse; font-size:12.5px; }
  table.compare-table th, table.compare-table td{ padding:8px 6px; border-bottom:1px solid var(--grid); text-align:left; }
  table.compare-table th{ color:var(--text-muted); font-weight:600; font-size:11px; }
  table.compare-table tr.mismatch td{ background:#fdecea; }
  table.compare-table .status-ok{ color:var(--good); font-weight:700; font-size:11.5px; }
  table.compare-table .status-bad{ color:var(--critical); font-weight:700; font-size:11.5px; }

  .section-title{ padding:16px 18px 4px; font-size:13px; font-weight:700; color:var(--text-secondary); }
  .trend-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 18px 4px; }
  .trend-card{ border:1px solid var(--border); border-radius:8px; padding:8px; }
  .trend-card .t-head{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .trend-card .t-now{ font-size:13px; font-weight:700; color:var(--text-primary); }
  .trend-card svg{ display:block; width:100%; height:56px; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#0b0b0b; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px;
    opacity:0; transition:.25s; z-index:50; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <h1><img src="logo.png" alt="BEVER"> BEVER</h1>
  <p>실측 데이터로 확인하는 우리 동네 하천 — 시민 제보로 함께 지켜요</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="rivers">하천 목록</button>
      <button class="tab-btn" data-tab="community">커뮤니티 제보</button>
    </div>

    <div class="tab-panel active" data-panel="rivers">
      <div class="sidebar-section">
        <div id="riverList"></div>
      </div>
    </div>

    <div class="tab-panel" data-panel="community">
      <div class="sidebar-section">
        <div class="community-stats" id="communityStats"></div>
        <select id="communityFilter" class="filter-select">
          <option value="all">전체 하천</option>
        </select>
        <form id="reportForm">
          <label>하천 선택
            <select id="reportRiver"></select>
          </label>
          <label>이상 증상
            <select id="reportSymptom">
              <option value="악취">악취</option>
              <option value="물고기 폐사">물고기 폐사</option>
              <option value="색 변화">색 변화</option>
              <option value="거품/기름막">거품/기름막</option>
              <option value="기타">기타</option>
            </select>
          </label>
          <label>상세 내용
            <textarea id="reportComment" maxlength="200" placeholder="본 것을 알려주세요 (선택)"></textarea>
          </label>
          <button type="submit">제보 등록</button>
        </form>
        <div id="reportFeed" class="report-feed"></div>
      </div>
    </div>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div id="mapFallback" class="map-fallback" style="display:none;">
      <div><b>카카오맵을 불러오지 못했습니다.</b></div>
      <div>카카오 개발자센터 → 내 애플리케이션 → 앱 키에서 <b>JavaScript 키</b>(REST API 키 아님)를 사용 중인지 확인하세요.</div>
      <div>플랫폼 설정 → Web 플랫폼에 아래 주소가 정확히 등록되어 있어야 합니다.</div>
      <div><code id="currentOrigin">-</code></div>
      <div>지도가 없어도 하천 목록·커뮤니티 제보 기능은 정상 동작합니다.</div>
    </div>
    <div class="alert-banner" id="alertBanner"></div>
    <div class="legend">
      <div class="title">수질 등급</div>
      <div class="row"><span class="sw" style="background:#2a78d6"></span>I 매우좋음</div>
      <div class="row"><span class="sw" style="background:#1baf7a"></span>II 좋음</div>
      <div class="row"><span class="sw" style="background:#0ca30c"></span>III 보통</div>
      <div class="row"><span class="sw" style="background:#fab219"></span>IV 약간나쁨</div>
      <div class="row"><span class="sw" style="background:#ec835a"></span>V 나쁨</div>
      <div class="row"><span class="sw" style="background:#d03b3b"></span>VI 매우나쁨</div>
    </div>
  </main>
</div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="detail-drawer" id="detailDrawer"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------
   Data
--------------------------------------------------------- */
const STANDARD = {
  bod:{ max:3.0, label:'BOD ≤ 3.0 mg/L' },
  do:{ min:5.0, label:'DO ≥ 5.0 mg/L' },
  ph:{ min:6.5, max:8.5, label:'pH 6.5~8.5' },
  turbidity:{ max:15, label:'탁도 ≤ 15 NTU' },
  tds:{ max:500, label:'TDS ≤ 500 mg/L' }
};

const METRICS = [
  { key:'bod', label:'BOD', unit:'mg/L' },
  { key:'do', label:'DO(용존산소)', unit:'mg/L' },
  { key:'ph', label:'pH', unit:'' },
  { key:'turbidity', label:'탁도', unit:'NTU' },
  { key:'tds', label:'TDS', unit:'mg/L' },
  { key:'temp', label:'수온', unit:'℃' }
];

const GRADE_COLOR = { I:'#2a78d6', II:'#1baf7a', III:'#0ca30c', IV:'#fab219', V:'#ec835a', VI:'#d03b3b' };
const GRADE_LABEL = { I:'매우좋음(청정)', II:'좋음(양호)', III:'보통', IV:'약간나쁨', V:'나쁨', VI:'매우나쁨(극도오염)' };

function gradeFromBOD(bod){
  if(bod<=3) return 'I';
  if(bod<=5) return 'II';
  if(bod<=8) return 'III';
  if(bod<=10) return 'IV';
  if(bod<=15) return 'V';
  return 'VI';
}
function gradeFromSensors(d){
  let score = 0;
  const doVal = d.do;
  if(doVal<2) score+=5;
  else if(doVal<3.5) score+=4;
  else if(doVal<5) score+=3;
  else if(doVal<6.5) score+=2;
  else if(doVal<7.5) score+=1;

  const ph = d.ph;
  if(ph<6.5 || ph>8.5){
    const dev = Math.abs(ph-7);
    score += Math.min(5, 1+Math.floor((dev-1.5)*2));
  }else if(Math.abs(ph-7)>1) score+=1;

  const turb = d.turbidity;
  if(turb>100) score+=3;
  else if(turb>50) score+=2;
  else if(turb>15) score+=1;

  const tds = d.tds;
  if(tds>2000) score+=3;
  else if(tds>1000) score+=2;
  else if(tds>500) score+=1;

  if(score<=1) return 'I';
  if(score<=3) return 'II';
  if(score<=5) return 'III';
  if(score<=8) return 'IV';
  if(score<=11) return 'V';
  return 'VI';
}
function computeGrade(dataObj){
  if(typeof dataObj.bod === 'number') return gradeFromBOD(dataObj.bod);
  if(typeof dataObj.do==='number' && typeof dataObj.ph==='number' && typeof dataObj.turbidity==='number' && typeof dataObj.tds==='number'){
    return gradeFromSensors(dataObj);
  }
  return 'III';
}

/* ---------------------------------------------------------
   Live data proxy (server.js — real-time sensors + AI diagnosis)
--------------------------------------------------------- */
const PROXY_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8787'
  : '';
let currentDetailRiverId = null;

function parseHourTime(ht){
  const y = +ht.slice(0,4), mo = +ht.slice(4,6)-1, d = +ht.slice(6,8), h = +ht.slice(8,10);
  return new Date(y, mo, d, h);
}
function fmtHourTime(ht){
  if(!ht) return '';
  return `${ht.slice(0,4)}-${ht.slice(4,6)}-${ht.slice(6,8)} ${ht.slice(8,10)}시`;
}
function metricSourceTag(r, key){
  if(key==='bod') return '<span class="src-tag src-lab">정밀분석</span>';
  if(r.isLive) return '<span class="src-tag src-live">실시간</span>';
  return '';
}

async function loadOneRiverLive(river){
  try{
    const res = await fetch(`${PROXY_BASE}/api/river-live?id=${river.id}`, { signal: AbortSignal.timeout(20000) });
    if(!res.ok) return;
    const info = await res.json();
    if(!info || !info.latest){ river.liveOffline = true; return; }
    const ageHours = (Date.now() - parseHourTime(info.latest.hourTime).getTime()) / 3600000;
    if(ageHours > 48){
      river.liveOffline = true;
      river.liveHourTime = info.latest.hourTime;
      return;
    }
    river.isLive = true;
    river.liveHourTime = info.latest.hourTime;
    river.liveTrend = info.trend24;
    ['do','ph','turbidity','tds','temp'].forEach(k=>{
      if(typeof info.latest[k] === 'number' && !Number.isNaN(info.latest[k])){
        river.actual[k] = info.latest[k];
        if(river.sensorOnly) river.official[k] = info.latest[k];
      }
    });
    river.actualGrade = computeGrade(river.actual);
    if(river.sensorOnly) river.officialGrade = computeGrade(river.official);
  }catch(err){
    console.warn(`실시간 데이터 실패 (${river.id})`, err);
  }
}

async function loadLiveRiverData(){
  await Promise.all(RIVERS.map(loadOneRiverLive));
  renderRiverList();
  renderCommunityStats();
  if(currentDetailRiverId){
    const r = RIVERS.find(x=>x.id===currentDetailRiverId);
    if(r) renderDetail(r);
  }
}

async function runAiDiagnosis(r){
  const btn = document.getElementById('aiDiagnoseBtn');
  const out = document.getElementById('aiDiagnoseResult');
  if(!btn || !out) return;
  btn.disabled = true;
  btn.textContent = '정밀 분석 중...';
  out.innerHTML = '';
  try{
    const riverReports = reports.filter(x=>x.riverId===r.id).slice(0,10);
    const trend = (r.isLive && r.liveTrend) ? r.liveTrend : null;
    const res = await fetch(`${PROXY_BASE}/api/diagnose`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ riverName:r.name, actual:r.actual, official:r.official, reports:riverReports, trend }),
      signal: AbortSignal.timeout(25000)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || '진단 실패');
    out.innerHTML = `<div class="ai-result">${escapeHtml(data.diagnosis).replace(/\n/g,'<br>')}</div>`;
  }catch(err){
    out.innerHTML = `<div class="ai-error">AI 진단 서버에 연결하지 못했습니다. 로컬에서 <code>node server.js</code> 실행 중인지, .env에 ANTHROPIC_API_KEY가 있는지 확인해주세요.<br><span style="font-size:11px;color:var(--text-muted)">${escapeHtml(String(err.message||err))}</span></div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = '🤖 AI 정밀진단 · 향후 예측';
  }
}

function renderCommunityStats(){
  const wrap = document.getElementById('communityStats');
  if(!wrap) return;
  const groups = {};
  const order = [];
  RIVERS.forEach(r=>{
    const group = r.name.split(' · ')[0];
    if(!groups[group]){ groups[group] = { count:0, grade:r.actualGrade }; order.push(group); }
    groups[group].count += reports.filter(x=>x.riverId===r.id).length;
    if(GRADE_RANK[r.actualGrade] > GRADE_RANK[groups[group].grade]) groups[group].grade = r.actualGrade;
  });
  wrap.innerHTML = order.map(g=>{
    const info = groups[g];
    return `<span class="stat-pill"><span class="dot" style="background:${GRADE_COLOR[info.grade]}"></span>${g} ${info.count}</span>`;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------------------------------------------------
   24h trend synthetic data + sparkline SVG
--------------------------------------------------------- */
function seeded(n){
  const x = Math.sin(n*12.9898)*43758.5453;
  return x - Math.floor(x);
}
function genSeries(base, noise, seedBase){
  const arr = [];
  for(let i=0;i<24;i++){
    const wave = Math.sin((i/24)*Math.PI*2 + seedBase)*noise*0.5;
    const rnd = (seeded(seedBase*97 + i) - 0.5)*noise;
    arr.push(Math.max(0, base + wave + rnd));
  }
  arr[23] = base;
  return arr;
}

function linearForecast(series, steps){
  const n = series.length;
  const take = Math.min(n, 8);
  const recent = series.slice(n-take);
  const xMean = (take-1)/2;
  const yMean = recent.reduce((a,b)=>a+b,0)/take;
  let num=0, den=0;
  recent.forEach((v,i)=>{ num += (i-xMean)*(v-yMean); den += (i-xMean)*(i-xMean); });
  const slope = den===0 ? 0 : num/den;
  const intercept = yMean - slope*xMean;
  const out = [];
  for(let s=1; s<=steps; s++){
    out.push(Math.max(0, intercept + slope*((take-1)+s)));
  }
  return out;
}

function sparklineSVG(values, color, thresholdLine, forecast){
  const w=220, h=56, pad=6;
  const all = forecast && forecast.length ? values.concat(forecast) : values;
  let min = Math.min(...all), max = Math.max(...all);
  if(thresholdLine!=null){ min = Math.min(min, thresholdLine); max = Math.max(max, thresholdLine); }
  if(max===min){ max += 1; min -= 1; }
  const totalPoints = all.length;
  const x = i => pad + (i/(totalPoints-1))*(w-pad*2);
  const y = v => h-pad - ((v-min)/(max-min))*(h-pad*2);
  const path = values.map((v,i)=> (i===0?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  let thresh = '';
  if(thresholdLine!=null){
    const ty = y(thresholdLine).toFixed(1);
    thresh = `<line x1="${pad}" y1="${ty}" x2="${w-pad}" y2="${ty}" stroke="#d03b3b" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>`;
  }
  const lastX = x(values.length-1), lastY = y(values[values.length-1]);
  let forecastPart = '';
  if(forecast && forecast.length){
    const fPath = [`M${lastX.toFixed(1)},${lastY.toFixed(1)}`]
      .concat(forecast.map((v,i)=> 'L'+x(values.length-1+i+1).toFixed(1)+','+y(v).toFixed(1)))
      .join(' ');
    const fEndX = x(values.length-1+forecast.length), fEndY = y(forecast[forecast.length-1]);
    forecastPart = `
      <path d="${fPath}" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${fEndX.toFixed(1)}" cy="${fEndY.toFixed(1)}" r="2.5" fill="#898781"/>
    `;
  }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${thresh}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="${color}"/>
    ${forecastPart}
  </svg>`;
}

function exceeds(key, val){
  const s = STANDARD[key];
  if(!s) return false;
  if(s.max!=null && val>s.max) return true;
  if(s.min!=null && val<s.min) return true;
  return false;
}

  const area = document.getElementById('metricsArea');
  const metricsList = metricsFor(r);
  area.innerHTML = `<div class="metrics-grid">
    ${metricsList.map(m=>{
      const val = r.actual[m.key];
      const bad = exceeds(m.key, val);
      return `<div class="metric-card">
        <div class="m-label">${m.label} ${metricSourceTag(r,m.key)}</div>
        <div class="m-value ${bad?'exceed':''}">${val}${m.unit}</div>
        ${STANDARD[m.key] ? `<div class="m-std">기준: ${STANDARD[m.key].label}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function renderTrends(r){
  const grid = document.getElementById('trendGrid');
  const metricsList = metricsFor(r);
  grid.innerHTML = metricsList.map((m,idx)=>{
    let series = null, forecast = null;
    if(r.isLive && m.key!=='bod' && r.liveTrend && r.liveTrend.length){
      const real = r.liveTrend.map(pt=>pt[m.key]).filter(v=>typeof v==='number' && !Number.isNaN(v));
      if(real.length>=2){ series = real; forecast = linearForecast(real, 6); }
    }
    const base = r.actual[m.key];
    if(!series){
      const noise = Math.max(base*0.08, 0.15);
      series = genSeries(base, noise, idx+1 + r.name.length);
    }
    const bad = exceeds(m.key, base);
    const color = bad ? '#d03b3b' : '#2a78d6';
    const std = STANDARD[m.key];
    const threshold = std ? (std.max!=null ? std.max : std.min) : null;
    return `<div class="trend-card">
      <div class="t-head"><span>${m.label} ${metricSourceTag(r,m.key)}</span><span>${forecast ? '24h + 예측 6h' : '24h'}</span></div>
      <div class="t-now" style="color:${bad?'#d03b3b':'#0b0b0b'}">${base}${m.unit}</div>
      ${sparklineSVG(series, color, threshold, forecast)}
    </div>`;
  }).join('');
}

/* ---------------------------------------------------------
   Kakao Map
--------------------------------------------------------- */
let map = null;
let mapReady = false;

function initMap(){
  const container = document.getElementById('map');
  map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(35.1691, 129.0480),
    level: 8
  });
  mapReady = true;

  RIVERS.forEach(addRiverMarker);
  reports.forEach(addReportMarker);
}

function addRiverMarker(r){
  const el = document.createElement('div');
  el.className = 'river-marker';
  el.style.background = GRADE_COLOR[r.actualGrade];
  el.title = `${r.name} (${r.actualGrade}등급)`;
  el.addEventListener('click', ()=> openDetail(r.id));
  new kakao.maps.CustomOverlay({
    map, position: new kakao.maps.LatLng(r.lat, r.lng), content: el, yAnchor: 0.5
  });
}

let openPopup = null;
function addReportMarker(rep){
  const river = RIVERS.find(x=>x.id===rep.riverId);
  const el = document.createElement('div');
  el.className = 'report-marker';
  el.title = `${river?river.name:''} 제보: ${rep.symptom}`;
  el.addEventListener('click', ()=>{
    if(openPopup){ openPopup.setMap(null); openPopup = null; }
    const box = document.createElement('div');
    box.className = 'kakao-popup';
    box.innerHTML = `<span class="close">✕</span>
      <b>${river?river.name:''}</b><br>
      <span style="color:#d03b3b;font-weight:700;">${rep.symptom}</span><br>
      ${rep.comment ? escapeHtml(rep.comment)+'<br>' : ''}
      <span style="color:#898781;">${fmtTime(rep.time)}</span>`;
    const popup = new kakao.maps.CustomOverlay({
      map, position: new kakao.maps.LatLng(rep.lat, rep.lng), content: box, yAnchor: 1.3
    });
    box.querySelector('.close').addEventListener('click', ()=> popup.setMap(null));
    openPopup = popup;
  });
  new kakao.maps.CustomOverlay({
    map, position: new kakao.maps.LatLng(rep.lat, rep.lng), content: el, yAnchor: 0.5
  });
}

function renderAlertBanner(){
  const manipulated = RIVERS.filter(r=>r.manipulated);
  const el = document.getElementById('alertBanner');
  if(manipulated.length===0){ el.classList.remove('show'); return; }
  el.classList.add('show');
  el.innerHTML = `⚠ 검증이 필요한 하천: ${manipulated.map(r=>r.name).join(', ')} <span class="ab-cta">자세히 보기 ›</span>`;
  el.onclick = ()=> openDetail(manipulated[0].id);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

document.getElementById('overlayBg').addEventListener('click', closeDetail);

document.getElementById('reportForm').addEventListener('submit', e=>{
  e.preventDefault();
  const riverId = document.getElementById('reportRiver').value;
  const symptom = document.getElementById('reportSymptom').value;
  const comment = document.getElementById('reportComment').value.trim();
  addReport(riverId, symptom, comment);
  document.getElementById('reportComment').value = '';
  showToast('제보가 등록되었습니다. 감사합니다!');
});

document.getElementById('communityFilter').addEventListener('change', renderReportFeed);

renderRiverList();
renderReportFeed();
renderCommunityStats();
loadLiveRiverData();

(function loadKakao(){
  const KEY = '38db833f1747297f55b45d683d0feb3f';
  let resolved = false;
  const script = document.createElement('script');
  script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${KEY}&autoload=false`;
  script.onload = ()=>{
    if(window.kakao && kakao.maps){
      kakao.maps.load(()=>{ resolved = true; initMap(); });
    }
  };
  script.onerror = showMapFallback;
  document.head.appendChild(script);
  setTimeout(()=>{ if(!resolved) showMapFallback(); }, 4000);
})();

function showMapFallback(){
  document.getElementById('mapFallback').style.display = 'flex';
  document.getElementById('currentOrigin').textContent = location.origin;
}
